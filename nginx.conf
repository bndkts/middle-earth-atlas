server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  charset_types text/css application/javascript image/svg+xml;

  # Revalidate stable filenames so deployments cannot leave stale scripts or data.
  add_header Cache-Control "public, max-age=0, must-revalidate";
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/xml text/plain image/svg+xml;

  # ES modules require a JavaScript MIME type (not every nginx mime.types has mjs).
  location = /src/details.mjs {
    types { application/javascript mjs; }
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
